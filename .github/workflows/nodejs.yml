name: NodeJS CI

on:
  pull_request:
    branches: ["main"]

env:
  BINARYEN_VERSION: "132"

jobs:
  node_test:
    name: "Node.js test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: 'npm'
          cache-dependency-path: nodejs/package-lock.json

      - working-directory: nodejs
        run: npm install

      - name: Install wasm target
        run: |
          rustup target add wasm32-unknown-unknown

      - name: Get wasm-bindgen version
        id: wasm-bindgen-version
        run: |
          VERSION=$(grep -A 1 'name = "wasm-bindgen"' Cargo.lock | grep version | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wasm-bindgen-version.outputs.version }}

      - name: Install wasm-opt
        uses: jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: WebAssembly/binaryen
          tag: version_${{ env.BINARYEN_VERSION }}
          binaries-location: binaryen-version_${{ env.BINARYEN_VERSION }}/bin
          chmod: 0755

      - name: Build the wasm module
        working-directory: nodejs
        run: |
          npm run build

      - name: Run the tests
        working-directory: nodejs
        run: |
          npm test
