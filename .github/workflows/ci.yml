name: Rust CI

on:
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust toolchain"
        run: rustup show
      - name: "Check formatting"
        run: cargo fmt --all --check
      - name: "Install cargo insta"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-insta
      - uses: Swatinem/rust-cache@v2
      - name: "Run tests"
        run: cargo insta test --all --all-features --unreferenced reject

  no_std:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust toolchain"
        run: rustup show
      - name: "Add bare-metal target"
        run: rustup target add x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - name: "Build for no_std (default)"
        run: |
          cargo build -p math-core-renderer-internal --no-default-features --target x86_64-unknown-none
          cargo build -p math-core --no-default-features --target x86_64-unknown-none
      - name: "Build for no_std (serde)"
        run: cargo build -p math-core --no-default-features --features serde --target x86_64-unknown-none
