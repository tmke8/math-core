# settings for auto-generated release notes

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      # Must be the exact account login, including the `[bot]` suffix.
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: Breaking Changes 🛠
      labels:
        - breaking
    - title: Enhancements 🎉
      labels:
        - enhancement
    - title: Documentation improvements ✍️
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
