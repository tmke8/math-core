[package]
name = "math-core-wasm"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
math-core = { path = "../math-core", default-features = false, features = ["ptrhash"] }
ariadne = { workspace = true, optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3.82"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = "0.4.1"

[features]
default = ["all-conversions", "interactive"]
ariadne = ["dep:ariadne", "math-core/ariadne"]
all-conversions = []
# Adds the `InteractiveDocument` class, for documents whose math changes over time.
interactive = []

[lints]
workspace = true
