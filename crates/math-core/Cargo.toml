[package]
name = "math-core"
authors = [
    "Hiromu Sugiura <h.sugiura0705@outlook.com>",
    "Thomas MK <tmke8@posteo.net>",
]
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
resolver = "2"

description = "Convert LaTeX equations to MathML Core"
readme = "../../README.md"
license = { workspace = true }
repository = { workspace = true }
keywords = ["latex", "mathml"]
categories = ["science"]

exclude = ["/src/snapshots", "/tests/snapshots"]

[dependencies]
mathml-renderer = { path = "../mathml-renderer", package = "math-core-renderer-internal", version = "0.7.0", default-features = false }
serde = { version = "1.0.228", optional = true, default-features = false, features = ["derive", "alloc"] }
serde-tuple-vec-map = { version = "1.0.1", optional = true, default-features = false }
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
strum = { version = "0.28.0", default-features = false }
strum_macros = { workspace = true }
static_assertions  = { workspace = true }
rustc-hash = { workspace = true }
hashbrown = { version = "0.16", default-features = false }
memchr = { version = "2.8.1", default-features = false }
ariadne = { workspace = true, optional = true }

[dev-dependencies]
math-core = { path = ".", features = ["serde", "ariadne"] }
mathml-renderer = { path = "../mathml-renderer", package = "math-core-renderer-internal", version = "0.7.0", features = ["serde"] }
insta = { version = "1.47.2", features = ["default", "ron"] }
regex = "1.12.3"
minijinja = "2.20.0"

[features]
default = ["std"]
std = [
    "memchr/std",
    "phf/std",
    "strum/std",
    "mathml-renderer/std",
    "serde?/std",
    "serde-tuple-vec-map?/std",
]
serde = ["dep:serde", "dep:serde-tuple-vec-map", "mathml-renderer/serde"]
ariadne = ["dep:ariadne"]

[lints]
workspace = true
